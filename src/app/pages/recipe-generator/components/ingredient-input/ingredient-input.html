<form class="ingredient-input" [formGroup]="ingredientForm" (ngSubmit)="onSubmit()" novalidate>
  <h2 id="ingredient-details-heading" class="ingredient-input__heading">Ingredient details</h2>

  <div class="ingredient-input__ingredient-column">
    <label class="ingredient-input__label" for="ingredient-name">Ingredient</label>
    <input
      id="ingredient-name"
      class="ingredient-input__text-field"
      type="text"
      formControlName="name"
      maxlength="50"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="ingredient-suggestions"
      aria-describedby="ingredient-form-feedback"
      [attr.aria-expanded]="suggestionPanelVisible()"
      [attr.aria-activedescendant]="
        suggestionPanelVisible() && ingredientSuggestions().length > 0
          ? 'ingredient-suggestion-' + activeSuggestionIndex()
          : null
      "
      [attr.aria-invalid]="showError(ingredientForm.controls.name)"
      (focus)="showIngredientSuggestions()"
      (input)="onIngredientInput()"
      (keydown)="onIngredientKeydown($event)"
      (blur)="hideIngredientSuggestions()"
    />

    @if (suggestionPanelVisible()) {
      <app-ingredient-suggestions
        [suggestions]="ingredientSuggestions()"
        [activeIndex]="activeSuggestionIndex()"
        (ingredientSelected)="selectIngredient($event)"
      />
    }
  </div>

  <div class="ingredient-input__serving-column">
    <span id="serving-size-label" class="ingredient-input__label">Serving size</span>

    <div
      class="ingredient-input__serving-controls"
      role="group"
      aria-labelledby="serving-size-label"
    >
      <input
        class="ingredient-input__amount-field"
        type="number"
        formControlName="amount"
        min="0.01"
        max="100000"
        step="0.01"
        placeholder="100"
        inputmode="decimal"
        aria-label="Amount"
        aria-describedby="ingredient-form-feedback"
        [attr.aria-invalid]="showError(ingredientForm.controls.amount)"
        (input)="clearSubmissionError()"
      />

      <span class="ingredient-input__unit-control">
        <select
          class="ingredient-input__unit-field"
          formControlName="unit"
          aria-label="Unit"
          (change)="clearSubmissionError()"
        >
          @for (unit of ingredientUnits; track unit.value) {
            <option [value]="unit.value">{{ unit.label }}</option>
          }
        </select>

        <span class="ingredient-input__unit-value" aria-hidden="true">
          {{ ingredientForm.controls.unit.value }}
        </span>

        <svg
          class="ingredient-input__unit-icon"
          width="10"
          height="5"
          viewBox="0 0 10 5"
          aria-hidden="true"
        >
          <path d="M5 5 0 0h10L5 5Z" />
        </svg>
      </span>

      <button
        class="ingredient-input__add-button"
        type="submit"
        [attr.aria-label]="editingIngredient() ? 'Update ingredient' : 'Add ingredient'"
        [attr.title]="editingIngredient() ? 'Update ingredient' : 'Add ingredient'"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path
            d="M9 18c-.283 0-.521-.096-.713-.288A.968.968 0 0 1 8 17v-7H1a.968.968 0 0 1-.713-.287A.968.968 0 0 1 0 9c0-.283.096-.521.287-.713A.968.968 0 0 1 1 8h7V1c0-.283.096-.521.287-.713A.968.968 0 0 1 9 0c.283 0 .521.096.713.287A.968.968 0 0 1 10 1v7h7c.283 0 .521.096.712.287A.968.968 0 0 1 18 9a.968.968 0 0 1-.288.713A.968.968 0 0 1 17 10h-7v7a.968.968 0 0 1-.287.712A.968.968 0 0 1 9 18Z"
          />
        </svg>
      </button>
    </div>
  </div>

  <p id="ingredient-form-feedback" class="ingredient-input__feedback" aria-live="polite">
    {{ validationMessage() }}
  </p>
</form>
