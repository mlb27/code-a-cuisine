<a class="recipe-card" routerLink="/recipe">
  <div class="recipe-card__copy">
    <div class="recipe-card__time">
      <svg class="recipe-card__time-icon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 1.75a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5Zm0 2v6.1l3.9 2.2" />
      </svg>
      <span>Cooking time: {{ cookingTime }}</span>
    </div>

    <h3 class="recipe-card__title">{{ title }}</h3>
  </div>

  <span class="recipe-card__likes" [attr.aria-label]="likes + ' likes'">
    <svg class="recipe-card__heart" viewBox="0 0 20 20" aria-hidden="true">
      <path
        d="M10 17.1 3.2 10.55A4.65 4.65 0 0 1 9.8 4l.2.22.2-.22a4.65 4.65 0 0 1 6.6 6.55L10 17.1Z"
      />
    </svg>
    <span>{{ likes }}</span>
  </span>
</a>
