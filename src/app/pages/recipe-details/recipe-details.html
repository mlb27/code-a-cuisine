<app-header backgroundTheme="light" backLabel="Recipe results" backLink="/results" />

<main class="recipe-details">
  <article class="recipe-details__card" aria-labelledby="recipe-title">
    <app-recipe-summary />

    <div class="recipe-details__sections">
      <app-recipe-ingredients />
      <app-recipe-directions />
    </div>

    <div class="recipe-details__meal-feedback">
      <p class="recipe-details__feedback-copy">
        <strong>Just finished this meal?</strong>
        <span>Give it a heart, so that the others know this is delicious.</span>
      </p>

      <button class="recipe-details__heart-button" type="button" aria-label="Give recipe a heart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M16.5 3c-1.74 0-3.41 1.01-4.5 2.09C10.91 4.01 9.24 3 7.5 3A5.46 5.46 0 0 0 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5A5.46 5.46 0 0 0 16.5 3Zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5A3.43 3.43 0 0 1 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87A3.91 3.91 0 0 1 16.5 5 3.43 3.43 0 0 1 20 8.5c0 2.89-3.14 5.74-7.9 10.05Z"
          />
        </svg>
      </button>
    </div>
  </article>

  <section class="recipe-details__cookbook-promo" aria-labelledby="cookbook-promo-title">
    <h2 id="cookbook-promo-title">Find inspiration for your next culinary adventure!</h2>
    <a class="recipe-details__cookbook-button" routerLink="/cookbook">Cookbook</a>
  </section>

  <div class="recipe-details__generation-cta">
    <a class="recipe-details__generate-link" routerLink="/generator">
      <span>Generate new recipe</span>
      <svg
        class="recipe-details__generate-icon"
        width="26"
        height="16"
        viewBox="-1 -8 26 16"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M0-1C-.552-1-1-.552-1 0S-.552 1 0 1V-1ZM24.707.707c.391-.39.391-1.024 0-1.414L18.343-7.071a1 1 0 0 0-1.414 1.414L22.586 0l-5.657 5.657a1 1 0 0 0 1.414 1.414L24.707.707ZM0 0v1h24v-2H0v1Z"
        />
      </svg>
    </a>
  </div>
</main>
