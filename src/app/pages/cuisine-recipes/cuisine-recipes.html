<app-header backgroundTheme="light" backLabel="Cookbook" backLink="/cookbook" />

<div class="cuisine-recipes__action-bar">
  <a class="cuisine-recipes__generate-button" routerLink="/generator">
    <span class="cuisine-recipes__generate-label-desktop">Generate a recipe</span>
    <span class="cuisine-recipes__generate-label-mobile">Generate recipe</span>
  </a>
</div>

<main class="cuisine-recipes">
  <section
    class="cuisine-recipes__hero"
    [attr.aria-label]="cuisine.name + ' cuisine'"
    [style.height.px]="cuisine.bannerHeight"
    [style.--mobile-banner-height]="cuisine.mobileBannerHeight + 'px'"
    [style.--mobile-heading-top]="cuisine.mobileHeadingTop + 'px'"
    [style.--mobile-heading-width]="cuisine.mobileHeadingWidth + 'px'"
  >
    <picture class="cuisine-recipes__hero-picture">
      <source media="(max-width: 767px)" [srcset]="cuisine.mobileBannerSource" />
      <img [src]="cuisine.bannerSource" alt="" width="1143" [attr.height]="cuisine.bannerHeight" />
    </picture>
    <h1 [style.top.px]="cuisine.headingTop">{{ cuisine.name }} cuisine</h1>
  </section>

  <section class="cuisine-recipes__list" [attr.aria-label]="cuisine.name + ' recipes'">
    @for (recipe of recipes; track recipe.number) {
      <app-cuisine-recipe-card
        [recipeNumber]="recipe.number"
        [title]="recipe.title"
        [cookingTime]="recipe.cookingTime"
        [likes]="recipe.likes"
        [tags]="recipe.tags"
      />
    }
  </section>

  <app-cuisine-pagination class="cuisine-recipes__pagination" />
</main>
