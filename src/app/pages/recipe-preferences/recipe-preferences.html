<app-header backgroundTheme="light" backLabel="Ingredients" backLink="/generator" />

<main class="recipe-preferences">
  <section class="recipe-preferences__content" aria-labelledby="preferences-heading">
    <h1 id="preferences-heading" class="recipe-preferences__title">Choose your preferences</h1>

    <form class="recipe-preferences__form">
      <div class="recipe-preferences__counters">
        <app-preference-counter
          class="recipe-preferences__counter recipe-preferences__counter--portions"
          heading="How many portions do you need?"
          itemLabel="Portion"
          pluralLabel="Portions"
          [maximum]="maximumPortionCount"
          [minimum]="minimumPortionCount"
          [value]="portionCount()"
          (valueChange)="updatePortionCount($event)"
        />

        <app-preference-counter
          class="recipe-preferences__counter recipe-preferences__counter--people"
          heading="How many are cooking?"
          itemLabel="Person"
          pluralLabel="People"
          [maximum]="maximumCookingPeopleCount"
          [minimum]="minimumCookingPeopleCount"
          [value]="cookingPeopleCount()"
          (valueChange)="updateCookingPeopleCount($event)"
        />
      </div>

      <div class="recipe-preferences__preference-card">
        <section
          class="recipe-preferences__group recipe-preferences__group--cooking"
          aria-labelledby="cooking-time-heading"
        >
          <h2 id="cooking-time-heading" class="recipe-preferences__group-heading">
            <svg class="recipe-preferences__group-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8 8.01 8.01 0 0 1-8 8Zm1-13h-2v5.41l3.79 3.8 1.42-1.42L13 11.59Z"
              />
            </svg>
            <span>Cooking time:</span>
          </h2>

          <div class="recipe-preferences__options recipe-preferences__options--cooking">
            @for (option of cookingTimeOptions; track option.label) {
              <app-preference-tag
                [label]="option.label"
                [hint]="option.hint ?? ''"
                [selected]="cookingTime() === option.value"
                [style.width.px]="option.width"
                (selectionChange)="updateCookingTime(option.value)"
              />
            }
          </div>
        </section>

        <section
          class="recipe-preferences__group recipe-preferences__group--cuisine"
          aria-labelledby="cuisine-heading"
        >
          <h2 id="cuisine-heading" class="recipe-preferences__group-heading">
            <svg class="recipe-preferences__group-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                transform="translate(2 2)"
                d="M10 20a10 10 0 1 1 0-20 10 10 0 0 1 0 20Zm-1-2.05V16a2 2 0 0 1-2-2v-1L2.2 8.2A8 8 0 0 0 9 17.95Zm6.9-2.55A8 8 0 0 0 13 2.6V3a2 2 0 0 1-2 2H9v2a1 1 0 0 1-1 1H6v2h6a1 1 0 0 1 1 1v3h1a2 2 0 0 1 1.9 1.4Z"
              />
            </svg>
            <span>Cuisine</span>
          </h2>

          <div class="recipe-preferences__options">
            @for (option of cuisineOptions; track option.label) {
              <app-preference-tag
                [label]="option.label"
                [selected]="cuisineStyle() === option.value"
                [style.width.px]="option.width"
                (selectionChange)="updateCuisineStyle(option.value)"
              />
            }
          </div>
        </section>

        <section
          class="recipe-preferences__group recipe-preferences__group--diet"
          aria-labelledby="diet-heading"
        >
          <h2 id="diet-heading" class="recipe-preferences__group-heading">
            <svg class="recipe-preferences__group-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                transform="translate(3 2)"
                d="M3 20v-9.15A4 4 0 0 1 0 7V0h2v6h1V0h2v6h1V0h2v7a4 4 0 0 1-3 3.85V20Zm10 0v-9.53c-1.8-.6-3-2.6-3-5.15C10 2.37 11.57 0 14 0s4 2.38 4 5.35c0 2.54-1.2 4.53-3 5.12V20Z"
              />
            </svg>
            <span>Diet preferences</span>
          </h2>

          <div class="recipe-preferences__options">
            @for (option of dietOptions; track option.label) {
              <app-preference-tag
                [label]="option.label"
                [selected]="dietPreference() === option.value"
                [style.width.px]="option.width"
                (selectionChange)="updateDietPreference(option.value)"
              />
            }
          </div>
        </section>
      </div>
    </form>
  </section>

  <div class="recipe-preferences__actions">
    <button
      class="recipe-preferences__generate-button"
      type="button"
      [attr.aria-describedby]="generationFeedback() ? 'generation-feedback' : null"
      (click)="generateRecipe()"
    >
      Generate a recipe
    </button>

    @if (generationFeedback(); as feedback) {
      <p id="generation-feedback" class="recipe-preferences__feedback" role="alert">
        {{ feedback }}
      </p>
    }
  </div>
</main>
